[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "longbridge-router"
version = "0.1.0"
description = "OAuth and market-aware Longbridge gateway"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.41.0", "httpx==0.28.1", "cryptography==50.0.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["router*"]

[tool.setuptools.package-data]
router = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
